name: Déploiement

# Push sur `main` → koya.codetrine.com. Réglages : secret ENV_FILE de
# l'environnement GitHub « production » (modèle : .env.example). Le site est
# statique : les réglages sont inscrits dans la page au build, donc tout
# changement d'ENV_FILE demande de relancer ce workflow.
# Même chaîne que le cockpit : image sur ghcr.io, puis `docker run` sur le
# serveur CodeTrine, dans le réseau `codetrine` (Caddy devant).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-koya-landing
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/koya-landing

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Réglages (.env.production)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env.production

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `context: .` : le build voit .env.production, écrit à l'étape précédente.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Déployer sur le serveur
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ env.IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: REGISTRY_TOKEN,ACTOR,TAG
          script: |
            set -e
            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            docker pull $TAG
            docker rm -f koya-landing || true
            docker run -d --name koya-landing --restart unless-stopped --network codetrine $TAG
            for i in $(seq 1 10); do
              if docker exec koya-landing wget -q -O /dev/null http://127.0.0.1/ >/dev/null 2>&1; then
                echo "✓ koya-landing répond"; docker image prune -f; exit 0
              fi
              sleep 1
            done
            echo "✗ koya-landing ne répond pas :"; docker logs --tail 30 koya-landing; exit 1
